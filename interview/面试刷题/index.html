<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吉利前端面试 - 选择题练习</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --success: #4ade80;
      --error: #f87171;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      line-height: 1.6;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--primary);
    }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .question-num {
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 12px;
    }
    .question-text { font-size: 1.05rem; margin-bottom: 20px; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .option:hover { background: rgba(255,255,255,0.08); }
    .option input { display: none; }
    .option.selected { border-color: var(--primary); background: rgba(56,189,248,0.1); }
    .option.correct { border-color: var(--success); background: rgba(74,222,128,0.1); }
    .option.wrong { border-color: var(--error); background: rgba(248,113,113,0.1); }
    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      flex-shrink: 0;
    }
    .option.correct .option-letter { background: var(--success); color: #0f172a; }
    .option.wrong .option-letter { background: var(--error); color: #0f172a; }
    .actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--primary); color: #0f172a; font-weight: 600; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text); }
    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
    }
    .result.right { background: rgba(74,222,128,0.15); color: var(--success); }
    .result.wrong { background: rgba(248,113,113,0.15); color: var(--error); }
    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: var(--card);
      border-radius: var(--radius);
    }
    .score-bar span { color: var(--muted); }
    .score-bar strong { color: var(--primary); }
    .end-screen {
      text-align: center;
      padding: 40px 24px;
    }
    .end-screen h2 { color: var(--primary); margin-bottom: 12px; }
    .end-screen p { color: var(--muted); margin-bottom: 24px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>吉利前端面试 · 选择题练习</h1>
    <p class="subtitle">基于《吉利前端面试-基于简历与星火园帮》与《前端面试-基础概念解析》</p>

    <div id="quizPanel">
      <div class="score-bar">
        <span>第 <strong id="currentNum">1</strong> / <strong id="totalNum">0</strong> 题</span>
        <span>正确 <strong id="correctCount">0</strong> 题</span>
      </div>
      <div class="card">
        <div class="question-num" id="questionLabel">题目</div>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="options"></div>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="btnSubmit">提交答案</button>
          <button type="button" class="btn btn-secondary" id="btnNext" class="hidden">下一题</button>
        </div>
        <div id="resultBox" class="result hidden"></div>
      </div>
    </div>

    <div id="endPanel" class="card end-screen hidden">
      <h2>本轮练习结束</h2>
      <p>共 <strong id="finalTotal">0</strong> 题，答对 <strong id="finalCorrect">0</strong> 题</p>
      <button type="button" class="btn btn-primary" id="btnRestart">再练一轮</button>
    </div>
  </div>

  <script>
    const questions = [
      {

        ],
        correct: 1
      },
      {
        q: "Vue2 中对象新增一个字段，默认是否是响应式的？如何变成响应式？",

          "不是响应式的，需要用 Vue.set 或 this.$set",

        correct: 1
      },
      {
        q: "Vue Router 中，query 和 params 传参的主要区别是？",

          "params 只能传字符串，query 可以传对象",
          "没有区别，可以混用"
        ],
        correct: 1
      },
      {
        q: "Vuex 中修改 state 的正确方式是？",

        ],
        correct: 1
      },
      {
        q: "Pinia 和 Vuex 的一个主要区别是？",
        options: [
          "Pinia 必须用 mutation，Vuex 不需要",

        ],
        correct: 1
      },
      {
        q: "v-if 和 v-show 的区别是？",

      },
      {
        q: "Flex 布局中，让两个子元素分别在父元素左右两侧的常用做法是？",

          "父元素 justify-content: space-between；或右侧子元素 margin-left: auto",

      },
      {
        q: "v-html 使用时需要注意的主要问题是？",
        options: [

        ],
        correct: 1
      },
      {
        q: "Vue3 的响应式底层用的是？",
        options: [
          "Object.defineProperty",
          "Proxy",
          "Object.observe",
          "defineGetter/setter"
        ],
        correct: 1
      },
      {
        q: "uni-app 和原生微信小程序开发的主要区别是？",
        options: [
          "uni-app 用 React 语法，原生用 WXML",
          "uni-app 用 Vue 单文件组件和 uni.xxx API，一套代码可发多端；原生用 WXML/WXSS 和 wx.xxx",
          "没有区别，只是名字不同",
          "原生小程序支持条件编译，uni-app 不支持"
        ],
        correct: 1
      },
      {
        q: "关于深拷贝和浅拷贝，下列说法正确的是？",

      },
      {

          "没有区别"
        ],
        correct: 1
      },
      {
        q: "RESTful 中，获取任务列表、创建任务、删除任务通常分别用？",
        options: [
          "POST /tasks、GET /tasks、POST /tasks/delete",
          "GET /tasks、POST /tasks、DELETE /tasks/:id",
          "GET /tasks、PUT /tasks、GET /tasks/delete",
          "POST /tasks/list、POST /tasks、GET /tasks/remove"
        ],
        correct: 1
      },
      {
        q: "防抖（debounce）和节流（throttle）的典型区别是？",
        options: [
          "防抖是限制频率，节流是延迟执行",
          "防抖是多次触发只执行最后一次（或第一次）；节流是固定时间间隔内只执行一次",

        ],
        correct: 1
      },
      {
        q: "BFC（块级格式化上下文）的常见触发条件不包括？",

        ],
        correct: 3
      },
      {

      {

    let currentIndex = 0;
    let correctCount = 0;
    let selectedIndex = -1;
    let answered = false;

    const totalNumEl = document.getElementById("totalNum");
    const currentNumEl = document.getElementById("currentNum");
    const correctCountEl = document.getElementById("correctCount");
    const questionTextEl = document.getElementById("questionText");
    const optionsEl = document.getElementById("options");
    const btnSubmit = document.getElementById("btnSubmit");
    const btnNext = document.getElementById("btnNext");
    const resultBox = document.getElementById("resultBox");
    const quizPanel = document.getElementById("quizPanel");
    const endPanel = document.getElementById("endPanel");
    const finalTotalEl = document.getElementById("finalTotal");
    const finalCorrectEl = document.getElementById("finalCorrect");
    const btnRestart = document.getElementById("btnRestart");

    const letters = ["A", "B", "C", "D"];

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    let shuffledQuestions = [];

    function startQuiz() {
      shuffledQuestions = shuffle(questions);
      currentIndex = 0;
      correctCount = 0;
      answered = false;
      quizPanel.classList.remove("hidden");
      endPanel.classList.add("hidden");
      renderQuestion();
    }

    function renderQuestion() {
      const total = shuffledQuestions.length;
      totalNumEl.textContent = total;
      currentNumEl.textContent = currentIndex + 1;
      correctCountEl.textContent = correctCount;

      const item = shuffledQuestions[currentIndex];
      questionTextEl.textContent = item.q;
      optionsEl.innerHTML = "";
      selectedIndex = -1;
      answered = false;
      resultBox.classList.add("hidden");
      resultBox.className = "result hidden";
      btnSubmit.classList.remove("hidden");
      btnNext.classList.add("hidden");

      item.options.forEach((opt, i) => {
        const label = document.createElement("label");
        label.className = "option";
        label.innerHTML = `
          <input type="radio" name="opt" value="${i}" />
          <span class="option-letter">${letters[i]}</span>
          <span class="option-text">${opt}</span>
        `;
        label.addEventListener("click", () => {
          if (answered) return;
          document.querySelectorAll(".option").forEach((o) => o.classList.remove("selected"));
          label.classList.add("selected");
          selectedIndex = i;
        });
        optionsEl.appendChild(label);
      });
    }

    function showResult(isCorrect) {
      answered = true;
      const opts = optionsEl.querySelectorAll(".option");
      opts.forEach((o, i) => {
        o.classList.remove("selected", "correct", "wrong");
        const item = shuffledQuestions[currentIndex];
        if (i === item.correct) o.classList.add("correct");
        else if (i === selectedIndex && !isCorrect) o.classList.add("wrong");
      });
      resultBox.classList.remove("hidden");
      resultBox.textContent = isCorrect ? "回答正确" : "回答错误，正确答案是 " + letters[shuffledQuestions[currentIndex].correct];
      resultBox.className = "result " + (isCorrect ? "right" : "wrong");
      btnSubmit.classList.add("hidden");
      btnNext.classList.remove("hidden");
    }

    btnSubmit.addEventListener("click", () => {
      if (answered) return;
      if (selectedIndex === -1) {
        alert("请先选择一个选项");
        return;
      }
      const item = shuffledQuestions[currentIndex];
      const isCorrect = selectedIndex === item.correct;
      if (isCorrect) correctCount++;
      showResult(isCorrect);
    });

    btnNext.addEventListener("click", () => {
      currentIndex++;
      if (currentIndex >= shuffledQuestions.length) {
        quizPanel.classList.add("hidden");
        endPanel.classList.remove("hidden");
        finalTotalEl.textContent = shuffledQuestions.length;
        finalCorrectEl.textContent = correctCount;
      } else {
        renderQuestion();
      }
    });

    btnRestart.addEventListener("click", startQuiz);

    startQuiz();
  </script>
